name: Render Diwali Watercolor Short

on:
  workflow_dispatch:
  push:
    paths:
      - "remotion/**"
      - ".github/workflows/render-diwali.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion/package.json

      - name: Install dependencies
        working-directory: remotion
        run: npm install

      - name: Install Chrome for Remotion
        working-directory: remotion
        run: npx remotion browser install chrome

      - name: Render 20-second vertical video
        working-directory: remotion
        run: npx remotion render src/index.ts DiwaliMarket out/diwali-watercolor-market.mp4 --codec=h264 --crf=22

      - name: Verify rendered video
        working-directory: remotion
        run: test -s out/diwali-watercolor-market.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: diwali-watercolor-market
          path: remotion/out/diwali-watercolor-market.mp4
          if-no-files-found: error
          retention-days: 7
