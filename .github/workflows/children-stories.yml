name: Generate Children's Story Video

on:
  workflow_dispatch:
    inputs:
      story_title:
        description: "Title for this test story"
        required: true
        default: "Milo and the Moonflower"

permissions:
  contents: read

concurrency:
  group: children-story-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate story video
        env:
          STORY_TITLE: ${{ inputs.story_title }}
        run: python src/generate_video.py

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: childrens-story-video
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7
